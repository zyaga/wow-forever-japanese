# Voice over: the voices we may use (the roster) and which kind of speaker each one reads (the cast rows).
# How it works: docs/systems/voice.md. Style ids are the engine's (GET /speakers). The pace is fixed when a
# file is made: the client has no playback rate.
#
# To recast a kind of speaker, change the voices of its cast row: `make voice-plan` lists the lines that
# change, and `make voice-generate` remakes exactly those (a file's fingerprint holds its voice and settings).
#
# PROVISIONAL: the two MVP voices, cast by gender only, until the audition picks the real cast.

engine = "http://127.0.0.1:10101"
speed_scale = 0.9

# the voice of a line no creature says (a quest an item or object starts), and of a book page whose author
# is not a known speaker
narrator = "v1628969216"
book_narrator = "v1628969216"

# One table per voice: model (its name on AivisHub), style (the engine's style id), licence (ACML 1.0 or
# CC0 only), fits (what it reads), and optionally pitch (default 0.0), intonation (default 1.0) and speed
# (default speed_scale).
[roster.aidacalm]
model = "阿井田 茂"
style = 1310138977 # Calm
licence = "ACML 1.0"
fits = "middle-aged calm male"

