# Cast rows, first match wins. `when` names profile fields (race, gender, age, archetype, role) and the value
# or list of values to match; a field left out matches anything. `voices` is a list: each creature gets one
# of them, always the same one (a hash of its id), so neighbours vary. A row with no voices yet is skipped.
# Kinds of being come first (a ghost sounds like a ghost before it sounds like its race), then age, then
# race and gender. A creature shown as both genders is cast twice, as male and as female.

[[cast]]
name = "ghost, female"
when = { archetype = "ghost", gender = "female" }
voices = ["v888753763"]

[[cast]]
name = "ghost"
when = { archetype = "ghost" }
voices = ["v1805828384"]

