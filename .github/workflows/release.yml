name: Release

# One run is a whole release (docs/operations/release.md): start it with "Run workflow" on the Actions tab, or
# `make release`. It runs every pull-request check, picks the next version from CHANGELOG.md, commits the changelog,
# tags, builds the zip, checks it, and only then pushes and publishes to CurseForge and a GitHub release.
# Nothing leaves the runner until the zip has passed `wfj package-check`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (optional). Empty: the next version by the rule in the release runbook."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_SET: ${{ secrets.CF_API_KEY != '' }} # true / false only; the token itself reaches the publish step alone
    outputs:
      version: ${{ steps.next.outputs.version }}
      resume: ${{ steps.next.outputs.resume }}
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on the main branch."
          exit 1
      # Without the token the packager skips CurseForge and still succeeds: stop before anything is pushed.
      - name: CurseForge token present
        if: env.CF_TOKEN_SET != 'true'
        run: |
          echo "::error::The CF_API_KEY repository secret is not set (docs/operations/release.md, one-time setup)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags decide the next version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      # Stops here when there is nothing under "## Unreleased" or the typed version is not valid.
      - id: next
        run: wfj release next-version ${VERSION:+--version "$VERSION"} | tee -a "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
      # A resume re-uploads to CurseForge, which never replaces a file: refuse when the GitHub release (the
      # packager's last upload) already holds the zip, so a finished release is not published twice.
      - name: Not already published
        if: steps.next.outputs.resume == 'true'
        run: |
          assets=$(gh release view "v$VERSION" --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length' 2>/dev/null || echo 0)
          if [ "$assets" != "0" ]; then
            echo "::error::v$VERSION is already published on GitHub. If CurseForge lacks it, upload that zip there by hand (docs/operations/release.md)."
            exit 1
          fi
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  validate:
    needs: plan
    uses: ./.github/workflows/pr.yml

  release:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the changelog commit + tag, create the GitHub release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RESUME: ${{ needs.plan.outputs.resume }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the write token reaches the push step only, not the build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline

      # On the runner only: nothing is pushed until the zip has been checked.
      - name: Changelog, commit and tag
        if: env.RESUME != 'true'
        run: |
          wfj release changelog --version "$VERSION" --date "$(date -u +%F)" --notes .release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Release $VERSION" -- CHANGELOG.md
          git tag -a "v$VERSION" -m "Release $VERSION"
      # A re-run of a release whose publish step failed: the commit and tag are already on main.
      - name: Notes of the release being resumed
        if: env.RESUME == 'true'
        run: wfj release notes --version "$VERSION" --notes .release-notes.md

      - name: Build
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d # build only
          pandoc: false
      - name: Check the zip
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then echo "::error::expected one zip in .release/, found ${#zips[@]}"; exit 1; fi
          wfj package-check "${zips[0]}" --version "$VERSION"

      - name: Push the changelog commit and tag
        if: env.RESUME != 'true'
        # --atomic: both or neither. Fails, and publishes nothing, if main moved since this run started.
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -c -o: no fresh copy; zip the package folder that was just checked, then upload it.
      - name: Publish to CurseForge and GitHub
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -c -o
          pandoc: false
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          ARCHIVE="${zips[0]:-}"
          # Already published: a failure here is reported, never a reason to re-run (that would upload twice).
          wfj package-check "$ARCHIVE" --version "$VERSION" \
            || echo "::warning::the published zip failed package-check; the file is live, see docs/operations/release.md"
          {
            echo "## Released $VERSION"
            echo
            echo "- Zip: \`$(basename "$ARCHIVE")\`, $(unzip -Z1 "$ARCHIVE" | grep -vc '/$') files"
            echo "- SHA-256: \`$(sha256sum "$ARCHIVE" | cut -d' ' -f1)\`"
            echo "- GitHub release: $SERVER/$REPO/releases/tag/v$VERSION"
            echo
            cat .release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
