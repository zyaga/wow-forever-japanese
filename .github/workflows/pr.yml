name: pr

on:
  pull_request:
    # Never on an edit of the title or body: such a run would skip the code checks, and on the pull request page
    # those skipped checks stand in front of the result of the last push. The text is checked on every push.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # the Release workflow runs these same checks before it publishes

# Read-only: no step here writes to the repo, and pull requests from forks run this too.
permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. Every other run (a push to main, a release) is
# a group of its own and is never cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    # The data gate. Validate needs both toolchains (luac).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `make validate --base origin/<base>` needs the base branch on pull requests
          persist-credentials: false # the job runs the pull request's own code; no token stays in .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"

      # Pull requests only. A change that reaches the game (addon/ or data/) adds a line for players under
      # "## Unreleased" in CHANGELOG.md; released sections stay as they were (docs/operations/release.md).
      - name: Changelog
        if: github.event_name == 'pull_request'
        run: wfj release changelog-gate --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      # Pull requests that change data/: what the English source gained, lost or changed, and which translation
      # lines moved status, in the run's summary. A summary needs no write permission (a PR comment would).
      - name: Data delta
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- data/)
          if [ -n "$changed" ]; then
            {
              echo "## Data delta against $BASE_REF"
              echo '```'
              wfj stats --delta "origin/$BASE_REF" || echo "(the delta could not be computed; see this step's log)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: ./.github/actions/lua-toolchain

      - run: make luac LUA=lua
      - run: make toc-check
      - run: make validate LUA=lua VALIDATE_FLAGS="${BASE_REF:+--base origin/$BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }} # set on pull_request only; an env value, not an expression in the script text

  lint:
    # Every static check, beside the tests instead of in front of them. Needs both toolchains (ruff, luacheck).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - uses: ./.github/actions/lua-toolchain
      - run: make lint LUA=lua

  python:
    # The Python suite under coverage, its test files dealt out over several machines. Each machine leaves its
    # counts for python-coverage to add up. The Lua toolchain is here for the tests that run the Lua tools.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tests read the history (the base branch, the tags)
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - uses: ./.github/actions/lua-toolchain
      - run: make coverage-py-run PYTEST_ARGS="--durations=20"
        env:
          WFJ_SHARD: ${{ matrix.shard }}/4
      - run: mv pipeline/.coverage "coverage-py.$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py-${{ matrix.shard }}
          path: coverage-py.*
          retention-days: 1

  python-coverage:
    # The Python coverage floor, over the counts of every machine of the python job.
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[dev]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-py-*
          merge-multiple: true
      # a machine whose counts did not arrive would lower the total, or pass a floor it never ran under
      - run: test "$(ls coverage-py.* | wc -l)" -eq 4
      - run: cd pipeline && python -m coverage combine -q ../coverage-py.*
      - run: make coverage-py-report

  lua:
    # The addon's tests under coverage (busted + luacov), their spec files dealt out over several machines. Each
    # machine leaves its counts for lua-coverage to add up. Needs no Python.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lua-toolchain
      - run: make coverage-lua-run LUA=lua SHARD="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      - run: mv luacov.stats.out "coverage-lua.$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lua-${{ matrix.shard }}
          path: coverage-lua.*
          retention-days: 1

  lua-coverage:
    # The Lua coverage floor, over the counts of every machine of the lua job.
    needs: lua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lua-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lua-*
          merge-multiple: true
      - run: test "$(ls coverage-lua.* | wc -l)" -eq 4
      - run: ls coverage-lua.* | lua tests/lua/merge-coverage.lua luacov.stats.out
      - run: make coverage-lua-report LUA=lua

  text:
    # Pull requests only. The title, body, branch name and commit messages are
    # public: no path on someone's machine, no tracker id, a noreply address on every commit, and nothing the
    # private rules name when the checkout has them. The check reads the title and body from the event file and
    # the branch from GITHUB_HEAD_REF, so none of it passes through the script text.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit messages since the base branch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Pull request text
        run: cd pipeline && python -m wfj public-check pr
        env:
          BASE_REF: ${{ github.base_ref }}
