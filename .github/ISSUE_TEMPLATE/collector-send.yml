name: Send collected English / 収集した英語の送付
description: Send the English text your game recorded, so it can be translated. / ゲームが記録した英語のテキストを送って、翻訳に役立てます。
title: "Collected English"
labels: ["collector-send"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Open this form from the game: on the **English Collector** settings page click **Send English**
        (or type `/wfj collector send`), then follow the steps in the window. The box below is filled in by the link,
        or you paste the text from the window into it. When the window says the text is too long to paste, zip
        **WoWForeverJapanese.lua** from `World of Warcraft\<client folder>\WTF\Account\<ACCOUNT>\SavedVariables\`
        and drag it into the box instead. After you submit, click **I sent it** in the game. A check reads the box
        within a minute and comments here.

        **What it contains:** the English game text the addon recorded: quest text, NPC dialogue with the ids of
        the NPCs who said it, item and spell descriptions, and NPC names, keyed by game id, with the game build
        and the addon version. Your character's name is never stored. Your character's class and race are noted
        too, because some lines change with them. It holds **no character name, account, realm, location, chat
        or time data.** Wording that depends on your character's gender ("sir" / "madam") is kept as your game
        shows it. This issue is public.

        ありがとうございます。このフォームはゲームから開きます。設定の「英語テキスト収集」ページで「英語を送る」をクリックするか
        `/wfj collector send` と入力し、ウィンドウの手順に従ってください。下の欄はリンクで入力されるか、ウィンドウの文字列を貼り付けます。
        長すぎて貼り付けられないとウィンドウに表示された場合は、
        `World of Warcraft\<クライアントのフォルダ>\WTF\Account\<アカウント>\SavedVariables\` にある
        **WoWForeverJapanese.lua** を zip にして、代わりに欄へドラッグしてください。送信したら、ゲーム内で「送信しました」をクリックします。
        1 分以内に自動チェックが欄を読み取り、ここにコメントします。

        **中身:** アドオンが記録したゲームの英語テキストです。クエスト本文、NPC のセリフとその NPC の ID、アイテムと呪文の説明、
        NPC の名前が、ゲーム内 ID ごとに、ゲームのビルドとアドオンのバージョンと一緒に入っています。
        キャラクター名は保存されません。一部の文章はクラスや種族で変わるため、キャラクターのクラスと種族も記録されます。
        **キャラクター名・アカウント・レルム・位置・チャット・時刻の情報は含まれません。**
        キャラクターの性別で変わる言い回し（"sir" / "madam"）はゲームの表示どおりに残ります。この Issue は公開されます。
  - type: textarea
    id: dump
    attributes:
      label: Collected English
      description: Filled in by the link, or the text from the game's window (it starts with `WFJC1:`), or the zipped file. / リンクで入力された内容、ゲームのウィンドウの文字列（`WFJC1:` で始まります）、または zip にしたファイル。
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Anything you want to add (optional). / 補足があれば（任意）。
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Permission
      options:
        - label: It contains only what is described above, and I am fine with it being public in this issue. / 上の説明どおりの内容で、この Issue で公開されてかまいません。
          required: true
